name: astrbot_plugin_dual_persona
display_name: 双人格热切换
# 比陪伴类插件（Amo 为 10）先执行，避免快捷指令被它的 stop_event 吞掉
plugin_order: 5
short_desc: 一体双生——在两个人格之间自由切换，共享全部回忆。
desc: >
  为 AstrBot 提供「双人格热切换」能力。

  ## 核心理念
  一体双生，共用记忆。两个人格共享同一份聊天上下文，切换时不清空
  历史记录，实现真正意义上的内在对话连续性。

  ## 使用方式
  - `/切换人格` —— 查看人格信息；`/切换人格 <人格名>` 直接切换
  - `/人格名来了` —— 快捷切换（后缀可配置）
  - `/当前人格` —— 查看当前人格与全部生效设置

  ## 人格作用范围
  默认全局互通：群里切成 A，私聊也是 A，只有一份人格状态；
  也可切换为按会话隔离。关键词自动切换默认只对管理员生效。
  - `/人格列表` —— 查看当前可用的人格
  - `/人格预览` —— 查看本轮实际注入的 system prompt，核对人设是否生效

  ## 情绪数值
  刺激累积到 100 才激发出另一面；最短驻留 20 分钟，随时间衰减回落。

  ## 换人判定
  强词命中即切；弱词需凑够数量、排除否定与疑问、并有 10 分钟防抖冷却。

  ## 模型自主切换
  可让模型自己判断该换人：回复末尾输出 [[switch:a]] / [[switch:b]]，
  插件剥离标记并切换人格。规则由用户在配置里填写。

  ## 状态可见
  - **WebUI 状态面板**：插件详情页 → 状态面板，实时查看当前人格、生效设置、各会话状态
  - **AI 自知**：当前人格与设置会注入 system prompt，模型能回答「你现在是谁」

  ## 自定义
  在 WebUI「插件配置」页面中选择/编辑两个人格、触发词、深夜时段、
  切换台词与管理员名单。
